# ServiceAccount vinculada à role IAM via EKS Pod Identity (fase 8.1 do guia).
# A associação entre esta SA e a role é feita por CLI, não aqui:
#   aws eks create-pod-identity-association --cluster-name <CLUSTER> \
#     --namespace app-detran --service-account app-api \
#     --role-arn arn:aws:iam::<CONTA>:role/detran-app-<ambiente>-app-api-role
# A role precisa de: secretsmanager:GetSecretValue no secret abaixo e
# kms:Decrypt na CMK alias/detran-app-<ambiente>-secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-api
  namespace: app-detran
---
# Fonte: UM secret JSON no Secrets Manager por ambiente —
# detran-app-AMBIENTE/app-api/env — com as chaves abaixo, mesmo conjunto
# configurado em .env.development.local, exceto:
#   - DATABASE_URL: lá aponta pro Postgres local (127.0.0.1). Aqui tem que ser
#     a connection string do RDS Proxy: postgresql://app_detran:<senha de
#     detran-app-AMBIENTE/rds/app>@<endpoint-do-proxy>:5432/app_detran?sslmode=require
#   - PORT / NODE_ENV / LOG_LEVEL: não são segredo, já estão fixos como env
#     comum no deployment.yaml com valor de produção.
# Ausentes porque não estão configuradas em .env.development.local: ITI_*,
# POSTHOG_*, SENTRY_DSN, PSEUDONYMOUS_ID_PEPPER, TDV_MOCK_* (mock — nunca
# fora de dev/QA). Acrescente seguindo o mesmo padrão se o ambiente precisar.
#
# syncSecret=true (diferente do que a fase 6.10 do guia recomenda por padrão)
# é deliberado aqui: a app lê process.env.*, não um volume montado. Isso
# materializa um Secret nativo do Kubernetes — aceitável porque o etcd já
# está cifrado com CMK (fase 6.1), e o guia cita essa troca como alternativa
# equivalente.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-api-env
  namespace: app-detran
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "detran-app-dev/app-api/env"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: GOVBR_IDSP_AUTHORIZE_URL
            objectAlias: GOVBR_IDSP_AUTHORIZE_URL
          - path: GOVBR_IDSP_IOS_CLIENT_ID
            objectAlias: GOVBR_IDSP_IOS_CLIENT_ID
          - path: GOVBR_IDSP_IOS_CLIENT_SECRET
            objectAlias: GOVBR_IDSP_IOS_CLIENT_SECRET
          - path: GOVBR_IDSP_ANDROID_CLIENT_ID
            objectAlias: GOVBR_IDSP_ANDROID_CLIENT_ID
          - path: GOVBR_IDSP_ANDROID_CLIENT_SECRET
            objectAlias: GOVBR_IDSP_ANDROID_CLIENT_SECRET
          - path: GOVBR_IDSP_ANDROID_REDIRECT_URI
            objectAlias: GOVBR_IDSP_ANDROID_REDIRECT_URI
          - path: GOVBR_IDSP_IOS_REDIRECT_URI
            objectAlias: GOVBR_IDSP_IOS_REDIRECT_URI
          - path: GOVBR_IDSP_SERVICES_BASE_URL
            objectAlias: GOVBR_IDSP_SERVICES_BASE_URL
          - path: GOVBR_IDSP_TOKEN_URL
            objectAlias: GOVBR_IDSP_TOKEN_URL
          - path: GOVBR_IDSP_USERINFO_URL
            objectAlias: GOVBR_IDSP_USERINFO_URL
          - path: SESSION_ENCRYPTION_KEY
            objectAlias: SESSION_ENCRYPTION_KEY
          - path: SERVICENOW_CSM_BASE_URL
            objectAlias: SERVICENOW_CSM_BASE_URL
          - path: SERVICENOW_CSM_USERNAME
            objectAlias: SERVICENOW_CSM_USERNAME
          - path: SERVICENOW_CSM_PASSWORD
            objectAlias: SERVICENOW_CSM_PASSWORD
          - path: SERVICENOW_API_BASE_URL
            objectAlias: SERVICENOW_API_BASE_URL
          - path: SERVICENOW_API_DASHBOARD_BASE_PATH
            objectAlias: SERVICENOW_API_DASHBOARD_BASE_PATH
          - path: SERVICENOW_API_CONSULTA_DEBITOS_BASE_PATH
            objectAlias: SERVICENOW_API_CONSULTA_DEBITOS_BASE_PATH
          - path: ROTA_CAIXA_POSTAL_BASE_URL
            objectAlias: ROTA_CAIXA_POSTAL_BASE_URL
          - path: ROTA_CAIXA_POSTAL_APP_TOPIC
            objectAlias: ROTA_CAIXA_POSTAL_APP_TOPIC
          - path: ROTA_VIDA_BASE_URL
            objectAlias: ROTA_VIDA_BASE_URL
          - path: ROTA_ARQUIVOS_BASE_URL
            objectAlias: ROTA_ARQUIVOS_BASE_URL
          - path: ROTA_CRV_PECAS_BASE_URL
            objectAlias: ROTA_CRV_PECAS_BASE_URL
          - path: ROTA_VISTORIAS_BASE_URL
            objectAlias: ROTA_VISTORIAS_BASE_URL
  secretObjects:
    - secretName: app-api-env
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: GOVBR_IDSP_AUTHORIZE_URL
          key: GOVBR_IDSP_AUTHORIZE_URL
        - objectName: GOVBR_IDSP_IOS_CLIENT_ID
          key: GOVBR_IDSP_IOS_CLIENT_ID
        - objectName: GOVBR_IDSP_IOS_CLIENT_SECRET
          key: GOVBR_IDSP_IOS_CLIENT_SECRET
        - objectName: GOVBR_IDSP_ANDROID_CLIENT_ID
          key: GOVBR_IDSP_ANDROID_CLIENT_ID
        - objectName: GOVBR_IDSP_ANDROID_CLIENT_SECRET
          key: GOVBR_IDSP_ANDROID_CLIENT_SECRET
        - objectName: GOVBR_IDSP_ANDROID_REDIRECT_URI
          key: GOVBR_IDSP_ANDROID_REDIRECT_URI
        - objectName: GOVBR_IDSP_IOS_REDIRECT_URI
          key: GOVBR_IDSP_IOS_REDIRECT_URI
        - objectName: GOVBR_IDSP_SERVICES_BASE_URL
          key: GOVBR_IDSP_SERVICES_BASE_URL
        - objectName: GOVBR_IDSP_TOKEN_URL
          key: GOVBR_IDSP_TOKEN_URL
        - objectName: GOVBR_IDSP_USERINFO_URL
          key: GOVBR_IDSP_USERINFO_URL
        - objectName: SESSION_ENCRYPTION_KEY
          key: SESSION_ENCRYPTION_KEY
        - objectName: SERVICENOW_CSM_BASE_URL
          key: SERVICENOW_CSM_BASE_URL
        - objectName: SERVICENOW_CSM_USERNAME
          key: SERVICENOW_CSM_USERNAME
        - objectName: SERVICENOW_CSM_PASSWORD
          key: SERVICENOW_CSM_PASSWORD
        - objectName: SERVICENOW_API_BASE_URL
          key: SERVICENOW_API_BASE_URL
        - objectName: SERVICENOW_API_DASHBOARD_BASE_PATH
          key: SERVICENOW_API_DASHBOARD_BASE_PATH
        - objectName: SERVICENOW_API_CONSULTA_DEBITOS_BASE_PATH
          key: SERVICENOW_API_CONSULTA_DEBITOS_BASE_PATH
        - objectName: ROTA_CAIXA_POSTAL_BASE_URL
          key: ROTA_CAIXA_POSTAL_BASE_URL
        - objectName: ROTA_CAIXA_POSTAL_APP_TOPIC
          key: ROTA_CAIXA_POSTAL_APP_TOPIC
        - objectName: ROTA_VIDA_BASE_URL
          key: ROTA_VIDA_BASE_URL
        - objectName: ROTA_ARQUIVOS_BASE_URL
          key: ROTA_ARQUIVOS_BASE_URL
        - objectName: ROTA_CRV_PECAS_BASE_URL
          key: ROTA_CRV_PECAS_BASE_URL
        - objectName: ROTA_VISTORIAS_BASE_URL
          key: ROTA_VISTORIAS_BASE_URL
