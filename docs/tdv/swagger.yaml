                  "$ref": "#/components/examples/VeiculosEncontradosResponse"
        '204':
          "$ref": "#/components/responses/NoContent"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '500':
