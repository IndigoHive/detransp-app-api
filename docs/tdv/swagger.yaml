​openapi: 3.0.1
info:
  title: API de Transferência Digital de Veículos (TDV)
  description: >
    # Início

    Bem vindo(a) à documentação da API de TDV!


    A API de TDV é uma API RESTful que você pode usar para realizar e consultar
    TDVs.


    A API de TDV usa HTTP. Respostas são retornadas no formato JSON.


    Para acessar a API de TDV você precisará de um
    _token_ de acesso de uma conta válida no GOV.BR. Os ambientes de
    desenvolvimento e homologação utilizam contas do ambiente de homologação
    (_staging_) do GOV.BR; o ambiente de produção utiliza contas do ambiente
    de produção do GOV.BR.


    As _base URL_ da API de TDV em cada ambiente
    são listadas a seguir:

    * __Desenvolvimento:__
    [https://apisndev.detran.sp.gov.br](https://apisndev.detran.sp.gov.br)

    * __Homologação:__
    [https://apisnqa.detran.sp.gov.br](https://apisnqa.detran.sp.gov.br)

    * __Produção:__
    [https://apisn.detran.sp.gov.br](https://apisn.detran.sp.gov.br)


    # Autenticação

    Você precisará incluir um _token_ de acesso OAuth 2.0 de uma conta válida
    no GOV.BR obtido através do IDPSP em todas as suas requisições à API de
    TDV. Qualquer pessoa com o seu _token_ de
    acesso OAuth 2.0 poderá ter acesso aos seus dados através da nossa API,
    sendo assim mantenha-o privado. Não compartilhe-o com outros usuários e
    certifique-se de removê-lo de quaisquer exemplos de código.


    Para obter o seu _token_ de acesso você precisará utilizar uma das
    aplicações autorizadas no IDPSP, pois o _token_ é devolvido para uma
    *Redirect URL* que precisa estar cadastrada no IDPSP.


    _Tokens_ de acesso fornecidos pelo IDPSP expiram a cada 1 (uma) hora. Se o
    seu _token_ de acesso expirar será necessário obter um novo fazendo um
    novo login na aplicação autorizada. Atualização (refresh) de _token_ de
    acesso não é permitida.


    Para passar a sua informação de autenticação para as suas requisições à
    API, use o cabeçalho `Authorization` da requisição com o valor `Bearer` e
    o _token_ de acesso separados por um espaço.


    Para criar uma conta no ambiente de homologação do GOV.BR, acesse
    [https://sso.staging.acesso.gov.br](https://sso.staging.acesso.gov.br) e
    informe o seu CPF. Na tela de informação de dados bancários, clique em
    __Tentar de outra forma__. Responda às perguntas apresentas com os
    seguintes dados:

    * __Nome da mãe:__ MAMAE

    * __Data de nascimento:__ 01/01/1980


    Siga os passos informando seu e-mail e código recebido, crie a senha e
    sua conta estará pronta para ser usada.


    # Fluxos de trabalho

    O diagrama de estados UML do processo da TDV é apresentado a seguir. O
    processo se desenvolve através da interação de dois papéis: o
    __proprietário/vendedor__
    e o __comprador__ do veículo. Os fluxos de trabalho principais de cada um
    destes papéis são descritos nas próximas seções.


    ![](//www.plantuml.com/plantuml/png/TP7FYjim48VlUWgnnq8Wpl_ieMoXbzvwMFPIzp18awseF38ZEpJFqqEWaAVmYrMADI4GxytwvlkDDEENs05tVUDL_Ese1OP6UqVOdLhKRV2dV53gbxEeiMcxaxOO3RksSu6KIkaEzLEbP_eDXulfVQWfeaUJoc33auQeOoNU8dbV4uxQGar790lQqI5ma-4eBqHU9ldBw_Ut6Mh33YoCzQNKLwd-ZJgauJpy3TecBJGjGqqcqC5nSuki9BBEBVikM3GU6Ax1cbAICJex_2FZ9k9hYMzkBqeyEe8yHOi-b9jju36naSJsmqGU7bD0OxwmwSaPa45aDU_8jqTifUKkjNo5Fv07ZiX7Dvn3JIsy5t4duZwB31GFo7UZ6TyF5-cw5xcQJzb01Zs8NCsL-l7ffvxnxFFrfrRbS_6iuGWqd86lq5xhysSzDiXqKTIbg0LEgCkYhaGjS49T5ReMjK1-LDT5tOXQe7zKDuLkHIsmVrItHTtTgxi2z_TmFyAqFnNpicqvg1SaspV-Fm00)


    ## Proprietário

    ### Criar uma TDV

    Você possui o veículo de placa BLK7C34 e gostaria de vendê-lo para outra
    pessoa. Para obter esse resultado você precisa de um _token_ de acesso
    válido.


    O diagrama de sequência UML a seguir apresenta os passos a serem
    executados.


    ![](https://www.plantuml.com/plantuml/png/nP9BZzem58Nt_0fhrgMJnC49B2hIa4wPya20MFIXwiOsoAeVaPEmwAZ_lVOm3CccgjH5LudydUjxxhcUrWtOfbLoKBcleA82tQ2xN0gk6tw7e4PKYZxCDdEqdnsU8LHYu0He-Cx_Jj13iKVtPoveAqqzWCeHXwXqw70v_VAjLx1Pxrn5Oq7NHswvfWBg8UF3wnrFbGGABxKJz7xnASbn_EQhraRn0zUCCsCdw7EHPsYsHhDYlyrM3dC5GjxuJqw1STzcUlBaBJNAgQXXucHkiYYAS1Z4unG7ZXehJbnDKFYhFycbQj_nV3NO7otRvn__DDjzn61K1eoNAIKnIMY9nm4-Hi0I4iCnZ9ykdNAZAWlF1eDH59CuJKWGlcJGWSjiEyzGjdee5lCyGn_MgvsFvL0irhirMXQhMR6xHjCfKs05V5S-X9gGVZwywZQFqWIJq4TJWh2sQ-mHB1CA5LBKW9R-HgUIvkHnsrDkMq2FxPbha6WXhDVfLl6U9ehyUDGTIAwuRheiptOPylWCqbY_kzlpI1ENZaC_rEiHZaWoUbtrnfep78GlkUuSS9oM9KjnwL8FWOwJU1mGKXvnpDCefJwnkd6zdQt_zX2k3l2_JFBtxgTSirR9tm00)


    1. (Opcional) Recupere a lista de veículos que você possui. Envie uma
    requisição para o _endpoint_ `GET`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/veiculos.

    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request GET \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/veiculos \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830'
    ```


    2. Crie uma TDV para o seu veículo. Envie uma requisição para o _endpoint_
    `POST` https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos
    contendo a placa do seu veículo e os seus dados. Veja a requisição completa
    a seguir usando cURL:

    ```

    curl --request POST \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830' \
        --data '{"placaVeiculo": "BLK7C34", "nomeVendedor": "ZECA DO DETRAN", \
        "emailVendedor": "zecadetran@gmail.com", "codigoVendedor": "22231049830", \
        "origem": "1"}'
    ```


    3. A resposta da operação retorna o código da TDV criada
    2da5b0deb8c6467cb3903f2ad764af14.
    Tome nota desse código, pois ele será utilizado nas próximas requisições.


    4. Realize a prova de vida. Utilize o autenticador recomendado para a
    plataforma que você está utilizando, e.g. Liveness e obtenha o código da
    prova de vida a348bbd83b7641ac9749066bf34e828c. Tome nota desse código, pois
    ele será utilizado nas próximas requisições.


    5. Informe os dados da venda. Envie uma requisição para o _endpoint_
    `PATCH` https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    contendo os dados do comprador e da venda. Veja a requisição completa a
    seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830' \
        --data '{"codigoComprador": "05246487601", "nomeComprador": "MARIA ANGELICA FONSECA VELOSO MENDES", \
        "emailComprador": "maria_mendes66@gmail.com", "cepComprador": "02873610", "bairroComprador": "Jardim Elisa Maria", \
        "logradouroComprador": "Rua Juvenal Lira", "numeroComprador": "221", "complementoComprador": "CASA 1", \
        "codigoProvaVidaVendedor": "a348bbd83b7641ac9749066bf34e828c", "valorVendaVeiculo": "87464", \
        "kmVeiculo": "32675", "estado": "2"}'
    ```

    6. Confirme a intenção da venda e crie a Autorização para Transferência de

    Propriedade de Veículo digital (ATPV-e). Envie uma requisição para o
    _endpoint_ `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o novo estado `3` da TDV. Veja a requisição completa a seguir
    usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830' \
        --data '{"codigoProvaVidaVendedor": "a348bbd83b7641ac9749066bf34e828c", "estado": "3"}'
    ```

    ### Assinar a Autorização para Transferência de Propriedade de Veículo
    digital (ATPV-e)

    Você possui a TDV de número TDV1470832 assinada pelo comprador e gostaria de
    assinar eletronicamente a Autorização para Transferência de Propriedade de
    Veículo digital (ATPV-e) da transação. Para obter esse resultado você
    precisa de um _token_ de acesso válido.


    O diagrama de sequência UML a seguir apresenta os passos a serem
    executados.


    ![](https:////www.plantuml.com/plantuml/png/LT31JeD0483XEqynwTbDiI1G3gO8QaaFza2G62_3xg2JhBi45fFM-EwkUj7JJFBFuSliPeUJMzvqCFh9aaSq3bQbPZAELe0pICt_Ot6ieQdQduWZ1_u0nFNtciEnQCezhDs4PXve8YCPPw58l1FBHTlrHk5L7ohgCvd4IIhxQ1j6mmPLciGuNCOVv4NAvf1UF9jE58jxjHEVqR4rehIASdWeHHHdQPW93kzkQidxssttLDtNLNi-uQFJX-xGO2PEmsVWKI0ypXjpa5RnYst-sjfVLh0Ze_mNlW00)


    1. Usando uma aplicação homologada pelo ITI, acesse a página de autenticação
    do ITI, e insira o código recebido via SMS no seu telefone celular. Para
    autenticação
    no ambiente de homologação você pode usar o código `12345`. O ITI devolve o
    código `OC-348708-i0FBIciHE9XZDGIDVzyaWtlKXKTa8-yf`na _querystring_ da
    _Redirect URL_ da aplicação cadastrada no ITI. Tome nota do _authorization
    code_,
    pois ele será utilizado na próxima requisição.


    2. Assine o documento eletronicamente. Envie uma requisição para o
    _endpoint_ `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o _authorization code_ e o novo estado `7` da TDV. Veja a
    requisição completa a seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830' \
        --header 'X-Authorization-Code: OC-348708-i0FBIciHE9XZDGIDVzyaWtlKXKTa8-yf' \
        --data '{"estado": "7"}'
    ```


    ## Comprador

    ### Assinar a Autorização para Transferência de Propriedade de Veículo
    digital (ATPV-e)

    Você está comprando o veículo de placa BLK7C34 para o qual o proprietário
    criou a TDV de número TDV1470832 e gostaria de assinar eletronicamente a
    Autorização para Transferência de Propriedade de Veículo digital (ATPV-e) da
    transação. Para obter esse resultado você precisa de um _token_ de acesso
    válido.


    O diagrama de sequência UML a seguir apresenta os passos a serem
    executados.


    ![](https://www.plantuml.com/plantuml/png/rPDF2zCm6CRl-nHX1tSnh7-oj2jCrrNP175JInceXxT9wW9jKfAqXudVtNG3sIxYnOEdDdd3y_n-WMoj0-E6hftr_YkPx44vD2zQAPGJSmGMiLO-3_FJErI-gMv3wENC7q3urVIReVtR4YsT0MKROOHY4Ypc0ez2ig7LzZNJN7xNXUvw0roRJR2A22LfGeFm1JWvmiQPGSny5i8-qqTdKzUNRqyjfxmi3d_gMKOSLdN0HPqoIcZ2wdWTn4q4FA44cf3y45wSwmoHbr_L7Ufaz0YLvF2RpayZmUCqhIbB10b5267Ame2bGUHtW3G_dqdlGUKZLdKd-bVugnk-QgJfW87E1wUvO2sOQVL9MCcdz4UbnNJ1Y__RcdhyC_Qo5sta5PpK2XTUF4F70iSafIJ2tILqEnjSSxB-S5uVTxOiuFE-6ld7ONSet-k_bzWAnVqB-GK0)


    1. Liste as TDVs ativas nas quais você foi citado como comprador. Envie uma
    requisição para o _endpoint_ `GET`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos.
    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request GET \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos?codigoComprador=05246487601&ativa=true \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601'
    ```


    2. A resposta da operação retorna a lista de TDVs ativas nas quais você foi
    é o vendedor ou o comprador. Localize a TDV criada para o veículo de placa
    BLK7C34
    cujo código é 2da5b0deb8c6467cb3903f2ad764af14. Tome nota desse código,
    pois ele será utilizado nas próximas requisições.


    3. Realize a prova de vida. Utilize o autenticador recomendado para a
    plataforma que você está utilizando, e.g. Liveness e obtenha o código da
    prova de vida 42ed388b6c7e41e1a18c10c8026c7a4f. Tome nota desse código, pois
    ele será utilizado nas próximas requisições.


    4. Confirme a intenção de compra. Envie uma requisição para o _endpoint_
    `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o código da prova de vida realizado e o novo estado `4` da TDV.
    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601' \
        --data '{"codigoProvaVidaComprador": "42ed388b6c7e41e1a18c10c8026c7a4f", "estado": "4"}'
    ```


    5. Confirme a autodeclaração de residência. Envie uma requisição para o
    _endpoint_
    `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o código da prova de vida realizado, a confirmação da
    autodeclaração
    de residência e o novo estado `5` da TDV. Veja a requisição completa a
    seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601' \
        --data '{"codigoProvaVidaComprador": "42ed388b6c7e41e1a18c10c8026c7a4f", "estado": "5", \
        "confirmacaoAutodeclaracaoResidenciaComprador": "true"}'
    ```


    6. Usando uma aplicação homologada pelo ITI, acesse a página de autenticação
    do ITI, e insira o código recebido via SMS no seu telefone celular. Para
    autenticação
    no ambiente de homologação você pode usar o código `12345`. O ITI devolve o
    código `OC-348642-mh1tBs0zA49NX9OBsTCaSGVvdQuBHTLo`na _querystring_ da
    _Redirect URL_ da aplicação cadastrada no ITI. Tome nota do _authorization
    code_,
    pois ele será utilizado na próxima requisição.


    7. Assine o documento eletronicamente. Envie uma requisição para o
    _endpoint_
    `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o _authorization code_ e o novo estado `6` da TDV. Veja a
    requisição completa a
    seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601' \
        --header 'X-Authorization-Code: OC-348642-mh1tBs0zA49NX9OBsTCaSGVvdQuBHTLo' \
        --data '{"estado": "6"}'
    ```


    ### Pagar os débitos do veículo via PIX

    Você está comprando o veículo de placa BLK7C34, o proprietário assinou
    eletronicamente a TDV de número TDV1470832 e você gostaria de pagar os
    débitos da TDV. Para obter esse resultado você precisa de um _token_ de
    acesso válido.


    O diagrama de sequência UML a seguir apresenta os passos a serem
    executados.


    ![](https://www.plantuml.com/plantuml/png/hP31QeGm443lViNWFMZLQkj1B5fARssHNaeFOpB2G3PcaxZVlyQRzptDyDx0W-bzG1UsYqxiFbcoHHCW7JIJ2PG2Uf2Qp_BjwnEcyVUGQ3dP3q1qSMtXuts2B3WqVY57HZ9weKZSYEMcLvyL2f_dND7y8kkgRkHSlkRbKg1gwWgNfohR5OVL9sWPXEXYlONnW7__ZqrTdP2hedFg-sU8h2UZubVk)


    1. (Opcional) Liste os débitos da TDV. Envie uma requisição para o
    _endpoint_ `GET`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14/debitos.

    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request GET \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14/debitos \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601'
    ```


    2. Obtenha o _QR code_ para pagamento dos débitos da TDV. Envie uma
    requisição para o _endpoint_ `GET`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14/qr-code.
    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request GET \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14/debitos \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601'
    ```


    3. Realize o pagamento do PIX usando o aplicativo do seu banco. Assim que o
    sistema identificar o pagamento ele atualizará o estado da TDV para `8`,
    __Taxa de serviço paga__.
    O sistema iniciará a criação do documento e assim que o veículo estiver no
    seu nome o sistema atualizará o estado da TDV para `9`, __Transferência
    concluída__.


    ## Proprietário/Comprador

    ### Cancelar TDV

    Você está negociando o veículo de placa BLK7C34 para o qual a TDV de número
    TDV1470832 foi criada e você gostaria de cancelar a transação. A TDV só
    pode ser cancelada enquanto não há comunicação de venda gerada para ela, ou
    seja,
    até o estado `6`, __ATPV-e assinada pelo comprador__ (vide digrama de
    estados UML
    do processo). Para obter esse resultado você precisa de um _token_ de acesso
    válido.


    O diagrama de sequência UML a seguir apresenta os passos a serem
    executados.


    ![](https://www.plantuml.com/plantuml/png/VP2nJiCm48RtF8NLWIsgaxfEYLHe5H2mTOYw88QBVK4dkRPbErqGxuvB5h8mtKd_wVjE_o4c26cwcCBdIOeysCHMdI6q2LSC8bE6bk7nzCRwf_Dl29wAVC3AXzlQifVddgrJ01j736WLGImrbbSaDHaN7vNJzEawT_41j0jxlgs55Bj6ykeE4brXdyA41VYCpCoCRc-kzu-5vNJikzV_FEjQmtRW6eUTaa8sQjZSyyrOWswaWB4INnWJQDUoYdylRVE7_L_qUQOM1xGwL_K3)


    1. Liste as TDVs ativas às quais você está associado. Envie uma requisição
    para o _endpoint_ `GET`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos.
    Veja a requisição completa a seguir usando cURL:

    ```

    curl --request GET \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos?codigoComprador=05246487601&ativa=true \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 05246487601'
    ```


    2. A resposta da operação retorna a lista de TDVs ativas nas quais você foi
    é o vendedor ou o comprador. Localize a TDV criada para o veículo de placa
    BLK7C34
    cujo código é 2da5b0deb8c6467cb3903f2ad764af14. Tome nota desse código,
    pois ele será utilizado na próxima requisição.


    3. Cancele a TDV. Envie uma requisição para o _endpoint_ `PATCH`
    https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14
    informando o estado `10`, __Transferência cancelada__. Veja a requisição
    completa a seguir usando cURL:

    ```

    curl --request PATCH \
        --url https://apisn.detran.sp.gov.br/api/x_mdpdd_be_tdv/v1/tdv/transferencias-de-veiculos/2da5b0deb8c6467cb3903f2ad764af14 \
        --header 'Authorization: Bearer {seu token de acesso}' \
        --header 'X-CPF-Usuario: 22231049830' \
        --data '{"estado": "10"}'
    ```


    # Exemplos de código


