              - nullable: true
            first:
              description: Primeira página de dados.
              oneOf:
              - type: string
                format: uri
              - "$ref": "#/components/schemas/Link"
              - nullable: true
            last:
              description: Última página de dados.
              oneOf:
              - type: string
                format: uri
              - "$ref": "#/components/schemas/Link"
              - nullable: true
            prev:
              description: Página de dados anterior.
              oneOf:
              - type: string
                format: uri
              - "$ref": "#/components/schemas/Link"
              - nullable: true
            next:
              description: Próxima página de dados.
