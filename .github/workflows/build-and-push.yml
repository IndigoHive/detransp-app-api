name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # necessário para o OIDC assumir o role de push no ECR
  contents: read

jobs:
  build-and-push:
    timeout-minutes: 15
    # Runner nativo arm64 — a imagem roda em nós m7g.xlarge (Graviton3, D20
    # no guia de implantação). Evita emulação via QEMU, que é mais lenta.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tag imutável (repositório é IMMUTABLE, fase 5.1 do guia): o SHA do
      # commit nunca é reaproveitado, então a mesma tag promovida de dev para
      # prd (fase 12.4) é garantidamente o mesmo artefato testado.
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: detran-app/app-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Summary
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: detran-app/app-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
